<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" stroke="#334155" stroke-width="3" stroke-opacity="0.6" />

  <!-- Subtle ambient inner glow -->
  <circle cx="256" cy="230" r="180" fill="url(#glowGrad)" />

  <!-- Route Path lines (GPS navigation trail) -->
  <path d="M140 370 C 140 290, 220 280, 240 220 C 255 175, 290 150, 360 140" 
        stroke="#334155" stroke-width="14" stroke-linecap="round" stroke-dasharray="18 16" />
  <path d="M140 370 C 140 290, 220 280, 240 220 C 255 175, 290 150, 360 140" 
        stroke="url(#accentGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 18" />

  <!-- Base Location Origin Node -->
  <circle cx="140" cy="370" r="18" fill="#1E293B" stroke="#64748B" stroke-width="6" />
  <circle cx="140" cy="370" r="8" fill="#10B981" />

  <!-- Center Dynamic Speed Navigation Arrow / Pin -->
  <g filter="url(#shadow)">
    <!-- Main fast dispatch arrow pointing forward-up -->
    <path d="M256 128 L356 312 L260 274 L256 272 L252 274 L156 312 Z" 
          fill="url(#accentGrad)" />
    <!-- Sleek inner wing highlight -->
    <path d="M256 128 L356 312 L256 272 Z" 
          fill="#34D399" fill-opacity="0.25" />
    <!-- Dynamic speed trail core -->
    <path d="M256 170 L318 288 L256 262 L194 288 Z" 
          fill="#064E3B" fill-opacity="0.6" />
    <circle cx="256" cy="236" r="12" fill="#FFFFFF" />
  </g>

  <!-- Destination Delivery Point Pulsing Pin -->
  <g filter="url(#shadow)">
    <circle cx="360" cy="140" r="28" fill="url(#skyGrad)" />
    <circle cx="360" cy="140" r="12" fill="#FFFFFF" />
  </g>
</svg>
